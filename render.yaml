services:
  - type: web
    name: shashka-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: shashka-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: BACKUP_STORAGE_PATH
        value: /app/backups
      - key: BACKUP_RETENTION_DAYS
        value: "7"
      - key: BACKUP_HOUR_UTC
        value: "2"
    disk:
      name: backups
      mountPath: /app/backups
      sizeGB: 1

databases:
  - name: shashka-db
    plan: basic-256mb
    postgresMajorVersion: "16"
